# Generated by GitPublish ("+ Windows build"). Safe to edit.
# Every push builds Defender.exe -> download it from the repo's Actions tab
# (open the run, see "Artifacts"). Pushing a v* tag (GitPublish "Tag" button)
# also attaches the .exe to a GitHub Release.
name: Windows build
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip "pyinstaller>=6"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build Defender.exe
        shell: bash
        run: |
          pyinstaller --onefile --name Defender --add-data "templates:templates" app.py
          mkdir -p out && cp "dist/Defender.exe" out/
      - uses: actions/upload-artifact@v4
        with:
          name: Defender-windows
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
